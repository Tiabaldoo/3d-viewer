<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#eee9e1"><title>3D-модель</title><style>:root{--ink:#2f2d2a;--muted:#77716a;--glass:rgba(255,255,255,.74);--shadow:0 12px 40px rgba(67,56,43,.12);--cut:#9b3f34}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#eee9e1;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink)}body{touch-action:none;background:radial-gradient(circle at 52% 42%,#faf8f4 0%,#f3efe8 43%,#e9e3da 100%)}#viewer{position:fixed;inset:0;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}.topbar{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:max(16px,env(safe-area-inset-top)) 18px 12px;pointer-events:none}.brand,.ui-btn,.help-card,.gesture,.loader-card,.cut-panel{background:var(--glass);border:1px solid rgba(255,255,255,.7);box-shadow:var(--shadow);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.brand{display:flex;gap:11px;align-items:center;padding:10px 13px;border-radius:16px;pointer-events:auto}.brand-icon{width:35px;height:35px;border-radius:11px;display:grid;place-items:center;background:rgba(88,77,63,.08);font-size:20px}.brand-title{font-size:14px;font-weight:750}.brand-sub{font-size:11px;color:var(--muted);margin-top:2px}.ui-btn{border-radius:14px;border:1px solid rgba(255,255,255,.75);padding:10px 13px;color:var(--ink);font:inherit;font-size:13px;font-weight:650;cursor:pointer;pointer-events:auto}.ui-btn.active{background:#3d3934;color:#fff;border-color:#3d3934}.toolbar{position:fixed;right:16px;top:50%;transform:translateY(-50%);z-index:5;display:flex;flex-direction:column;gap:8px}.tool{width:46px;height:46px;padding:0;display ght:34px;border-radius:50%;background:#fff;border:2px solid var(--cut);display:grid;place-items:center;font-size:14px;color:var(--cut);box-shadow:0 5px 18px rgba(70,40,35,.18);user-select:none}.cut-line.v .cut-handle{left:-1px;top:50%;transform:translateY(-50%)}.cut-line.h .cut-handle{top:-1px;left:50%;transform:translateX(-50%)}.invert{position:absolute;pointer-events:auto;border:0;border-radius:12px;background:#fff;color:var(--cut);font:700 12px Arial;padding:9px 10px;box-shadow:0 5px 18px rgba(70,40,35,.16);white-space:nowrap}.cut-line.v .invert{left:38px;top:50%;transform:translateY(-50%)}.cut-line.h .invert{top:38px;left:50%;transform:translateX(-50%)}.cut-panel{position:fixed;left:50%;top:max(82px,calc(env(safe-area-inset-top) + 82px));transform:translateX(-50%);z-index:7;padding:8px 12px;border-radius:14px;font-size:12px;color:#5c564f;display:none;pointer-events:none}.cut-panel.show{display:block}@media(max-width:600px){.brand-sub{display:none}.brand{padding:8px 10px}.brand-icon{width:32px;height:32px}.topbar{padding-left:12px;padding-right:12px}.toolbar{right:10px}.tool{width:43px;height:43px}.bottom{bottom:max(12px,env(safe-area-inset-bottom))}.bottom .ui-btn{padding:10px 12px;font-size:12px}.gesture{bottom:max(68px,calc(env(safe-area-inset-bottom) + 68px));font-size:11px}}</style></head><body><div id="viewer"></div><div id="loading"><div class="loader-card"><div class="loader-title" id="status">Загрузка 3D-модели…</div><div class="loader-sub">Файл большой, первая загрузка может занять немного времени</div><div class="bar"><div id="fill" class="fill"></div></div></div></div><div class="topbar"><div class="brand"><div class="brand-icon">◈</div><div><div class="brand-title">3D VIEWER</div><div class="brand-sub">Интерактивный просмотр модели</div></div></div><button id="helpBtn" class="ui-btn">ⓘ Помощь</button></div><div id="help" class="help-card"><div class="help-title" id="helpTitle">Управление</div><div id="helpRows"></div></div><div class="toolbar"><button id="front" class="ui-btn tool" title="Вид спереди">⌂</button><button id="cutBtn" class="ui-btn tool" title="Разрез">✂</button><button id="fullscreen" class="ui-btn tool" title="На весь экран">⛶</button></div><div id="gesture" class="gesture"></div><div class="bottom"><button id="reset" class="ui-btn">↻ Сброс</button><button id="zoomOut" class="ui-btn">−</button><button id="zoomIn" class="ui-btn">＋</button><button id="front2" class="ui-btn">Вид спереди</button></div><div id="cutPanel" class="cut-panel">Режим разреза · линии привязаны к экрану</div><div id="cutUi" class="cut-ui"><div id="vCut" class="cut-line v"><div class="cut-handle">↔</div><button id="vInvert" class="invert">Инверсия ↔</button></div><div id="hCut" class="cut-line h"><div class="cut-handle">↕</div><button id="hInvert" class="invert">Инверсия ↕</button></div></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script><script type="module">import * as THREE from 'three';import{TrackballControls}from'three/addons/controls/TrackballControls.js';import{STLLoader}from'three/addons/loaders/STLLoader.js';const host=document.getElementById('viewer'),loading=document.getElementById('loading'),status=document.getElementById('status'),fill=document.getElementById('fill');const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,100000);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.04;renderer.shadowMap.enabled=true;renderer.localClippingEnabled=true;host.appendChild(renderer.domElement);const controls=new TrackballControls(camera,renderer.domElement);controls.rotateSpeed=1.55;controls.zoomSpeed=.34;controls.panSpeed=.14;controls.staticMoving=true;const hemi=new THREE.HemisphereLight(0xfffbef,0x756d63,2);scene.add(hemi);const key=new THREE.DirectionalLight(0xfff4d7,4.2);key.position.set(3,4,5);scene.add(key);const fillLight=new THREE.DirectionalLight(0xdfe8ff,1.3);fillLight.position.set(-4,1,3);scene.add(fillLight);const rim=new THREE.DirectionalLight(0xffead0,2);rim.position.set(-2,3,-5);scene.add(rim);let mesh,material,modelSize=1;const homePos=new THREE.Vector3(),homeTarget=new THREE.Vector3(),frontPos=new THREE.Vector3();function fitObject(obj){const box=new THREE.Box3().setFromObject(obj),center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3());obj.position.sub(center);modelSize=Math.max(size.x,size.y,size.z);const fov=THREE.MathUtils.degToRad(camera.fov);let dist=(modelSize/2)/Math.tan(fov/2);dist*=1.42;camera.near=Math.max(modelSize/2000,.01);camera.far=modelSize*100;camera.updateProjectionMatrix();camera.position.set(dist*.56,dist*.30,dist);controls.target.set(0,0,0);controls.minDistance=modelSize*.12;controls.maxDistance=modelSize*14;controls.update();homePos.copy(camera.position);homeTarget.copy(controls.target);frontPos.set(0,0,dist*1.1)}function resetView(){camera.position.copy(homePos);camera.up.set(0,1,0);controls.target.copy(homeTarget);controls.update()}function frontView(){camera.position.copy(frontPos);camera.up.set(0,1,0);controls.target.set(0,0,0);controls.update()}function dolly(mult){const dir=camera.position.clone().sub(controls.target);dir.multiplyScalar(mult);const d=dir.length();if(d<controls.minDistance||d>controls.maxDistance)return;camera.position.copy(controls.target).add(dir);controls.update()}new STLLoader().load('model.stl',g=>{g.computeVertexNormals();material=new THREE.MeshStandardMaterial({color:0xe7d6ae,roughness:.72,metalness:0,side:THREE.DoubleSide,clippingPlanes:[],clipShadows:true});mesh=new THREE.Mesh(g,material);scene.add(mesh);fitObject(mesh);loading.style.opacity='0';setTimeout(()=>loading.style.display='none',380);setTimeout(()=>gesture.style.opacity='.25',5500)},xhr=>{if(xhr.total){const p=Math.round(xhr.loaded/xhr.total*100);fill.style.width=p+'%';status.textContent='Загрузка 3D-модели… '+p+'%'}else status.textContent='Загружено '+(xhr.loaded/1024/1024).toFixed(1)+' МБ…'},err=>{console.error(err);status.textContent='Не удалось загрузить модель'});const coarse=matchMedia('(pointer: coarse)').matches||navigator.maxTouchPoints>0,helpRows=document.getElementById('helpRows'),gesture=document.getElementById('gesture'),helpTitle=document.getElementById('helpTitle');if(coarse){helpTitle.textContent='Управление — сенсорный экран';helpRows.innerHTML='<div class="row"><b>Вращение:</b> ведите одним пальцем.</div><div class="row"><b>Масштаб:</b> сведите или разведите два пальца.</div><div class="row"><b>Перемещение:</b> ведите двумя пальцами вместе.</div><div class="row"><b>Закручивание:</b> поверните два пальца вокруг общего центра.</div><div class="row"><b>Разрез:</b> включите ✂ и двигайте красные линии пальцем.</div>';gesture.textContent='☝ 1 палец — вращение · 2 пальца — масштаб, сдвиг и закручивание'}else{helpTitle.textContent='Управление — мышь';helpRows.innerHTML='<div class="row"><b>Вращение:</b> зажмите левую кнопку мыши и двигайте.</div><div class="row"><b>Масштаб:</b> используйте колесо мыши.</div><div class="row"><b>Перемещение:</b> зажмите правую кнопку мыши и двигайте.</div><div class="row"><b>Разрез:</b> включите ✂ и перетаскивайте красные линии мышью.</div>';gesture.textContent='🖱 ЛКМ — вращение · колесо — масштаб · ПКМ — сдвиг'}let twistActive=false,lastTwistAngle=0;function touchAngle(t){const a=t[0],b=t[1];return Math.atan2(b.clientY-a.clientY,b.clientX-a.clientX)}renderer.domElement.addEventListener('touchstart',e=>{if(e.touches.length===2){lastTwistAngle=touchAngle(e.touches);twistActive=true}},true);renderer.domElement.addEventListener('touchmove',e=>{if(!twistActive||e.touches.length!==2)return;const angle=touchAngle(e.touches);let delta=angle-lastTwistAngle;if(delta>Math.PI)delta-=Math.PI*2;if(delta<-Math.PI)delta+=Math.PI*2;if(Math.abs(delta)>.001){const viewAxis=controls.target.clone().sub(camera.position).normalize();const q=new THREE.Quaternion().setFromAxisAngle(viewAxis,-delta);camera.up.applyQuaternion(q).normalize()}lastTwistAngle=angle},{capture:true,passive:false});renderer.domElement.addEventListener('touchend',e=>{if(e.touches.length<2)twistActive=false},true);const cutBtn=document.getElementById('cutBtn'),cutUi=document.getElementById('cutUi'),cutPanel=document.getElementById('cutPanel'),vCut=document.getElementById('vCut'),hCut=document.getElementById('hCut'),vInvert=document.getElementById('vInvert'),hInvert=document.getElementById('hInvert');let cutMode=false,vNorm=.5,hNorm=.5,vSign=1,hSign=1;const vPlane=new THREE.Plane(),hPlane=new THREE.Plane();function placeLines(){vCut.style.left=vNorm*innerWidth+'px';hCut.style.top=hNorm*innerHeight+'px'}placeLines();function setCutMode(on){cutMode=on;cutBtn.classList.toggle('active',on);cutUi.classList.toggle('show',on);cutPanel.classList.toggle('show',on);if(material)material.clippingPlanes=on?[vPlane,hPlane]:[]}cutBtn.onclick=()=>setCutMode(!cutMode);function dragLine(el,axis){let dragging=false;el.addEventListener('pointerdown',e=>{dragging=true;controls.enabled=false;el.setPointerCapture?.(e.pointerId);e.preventDefault()});el.addEventListener('pointermove',e=>{if(!dragging)return;e.preventDefault();if(axis==='x')vNorm=THREE.MathUtils.clamp(e.clientX/innerWidth,.03,.97);else hNorm=THREE.MathUtils.clamp(e.clientY/innerHeight,.05,.95);placeLines()});const end=e=>{if(!dragging)return;dragging=false;controls.enabled=true;try{el.releasePointerCapture?.(e.pointerId)}catch(_){}};el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end)}dragLine(vCut,'x');dragLine(hCut,'y');vInvert.onclick=e=>{e.stopPropagation();vSign*=-1;vInvert.textContent='Инверсия ↔'+(vSign<0?' ✓':'')};hInvert.onclick=e=>{e.stopPropagation();hSign*=-1;hInvert.textContent='Инверсия ↕'+(hSign<0?' ✓':'')};const right=new THREE.Vector3(),up=new THREE.Vector3(),view=new THREE.Vector3(),origin=new THREE.Vector3(),pt=new THREE.Vector3();function updateCuts(){if(!cutMode||!mesh)return;camera.getWorldDirection(view).normalize();right.crossVectors(view,camera.up).normalize();up.copy(camera.up).normalize();origin.copy(controls.target);const dist=camera.position.distanceTo(controls.target),halfH=Math.tan(THREE.MathUtils.degToRad(camera.fov*.5))*dist,halfW=halfH*camera.aspect,x=(vNorm-.5)*2*halfW,y=(.5-hNorm)*2*halfH;pt.copy(origin).addScaledVector(right,x);vPlane.setFromNormalAndCoplanarPoint(right.clone().multiplyScalar(vSign),pt);pt.copy(origin).addScaledVector(up,y);hPlane.setFromNormalAndCoplanarPoint(up.clone().multiplyScalar(hSign),pt)}const help=document.getElementById('help');document.getElementById('helpBtn').onclick=()=>help.classList.toggle('show');document.getElementById('reset').onclick=resetView;document.getElementById('front').onclick=frontView;document.getElementById('front2').onclick=frontView;document.getElementById('zoomIn').onclick=()=>dolly(.88);document.getElementById('zoomOut').onclick=()=>dolly(1.14);document.getElementById('fullscreen').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){}};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);controls.handleResize();placeLines()});function animate(){requestAnimationFrame(animate);controls.update();updateCuts();renderer.render(scene,camera)}animate();</script></body></html>
