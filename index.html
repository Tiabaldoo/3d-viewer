<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>3D-модель</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f4f6;font-family:Arial,sans-serif}
    #viewer{position:fixed;inset:0}
    #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;background:#f3f4f6}
    .card{width:min(420px,80vw);text-align:center}
    .bar{height:8px;background:#d9dde3;border-radius:99px;overflow:hidden;margin-top:14px}
    .fill{height:100%;width:0;background:#333;border-radius:99px;transition:width .15s}
    #hint{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(255,255,255,.85);backdrop-filter:blur(8px);padding:9px 14px;border-radius:999px;font-size:13px;color:#333;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.08);z-index:5}
    #reset{position:fixed;right:16px;top:max(16px,env(safe-area-inset-top));z-index:5;border:0;background:rgba(255,255,255,.9);padding:10px 14px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.08);cursor:pointer}
  </style>
</head>
<body>
<div id="viewer"></div>
<div id="loading"><div class="card"><div id="status">Загрузка 3D-модели…</div><div class="bar"><div id="fill" class="fill"></div></div></div></div>
<button id="reset">Сбросить вид</button>
<div id="hint">Вращение — пальцем/мышью · Масштаб — щипком/колесом</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';

const host = document.getElementById('viewer');
const loading = document.getElementById('loading');
const status = document.getElementById('status');
const fill = document.getElementById('fill');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf3f4f6);

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 100000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
host.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = .06;

scene.add(new THREE.HemisphereLight(0xffffff,0x777777,2.4));
const key = new THREE.DirectionalLight(0xffffff,3.0); key.position.set(2,3,4); scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff,1.5); rim.position.set(-3,1,-2); scene.add(rim);

let mesh, homePos = new THREE.Vector3(), homeTarget = new THREE.Vector3();

function fitObject(obj){
  const box = new THREE.Box3().setFromObject(obj);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  obj.position.sub(center);

  const maxDim = Math.max(size.x,size.y,size.z);
  const fov = THREE.MathUtils.degToRad(camera.fov);
  let dist = (maxDim/2)/Math.tan(fov/2);
  dist *= 1.35;

  camera.near = Math.max(maxDim/1000,0.01);
  camera.far = maxDim*100;
  camera.updateProjectionMatrix();
  camera.position.set(dist*.65, dist*.45, dist);
  controls.target.set(0,0,0);
  controls.minDistance = maxDim*.08;
  controls.maxDistance = maxDim*12;
  controls.update();

  homePos.copy(camera.position);
  homeTarget.copy(controls.target);
}

new STLLoader().load(
  'model.stl',
  geometry => {
    geometry.computeVertexNormals();
    const material = new THREE.MeshStandardMaterial({color:0xd9dde3, roughness:.58, metalness:.03, side:THREE.DoubleSide});
    mesh = new THREE.Mesh(geometry,material);
    scene.add(mesh);
    fitObject(mesh);
    loading.style.display='none';
  },
  xhr => {
    if(xhr.total){
      const p=Math.round(xhr.loaded/xhr.total*100);
      fill.style.width=p+'%';
      status.textContent='Загрузка 3D-модели… '+p+'%';
    } else {
      status.textContent='Загружено '+(xhr.loaded/1024/1024).toFixed(1)+' МБ…';
    }
  },
  err => {
    console.error(err);
    status.textContent='Не удалось загрузить model.stl';
  }
);

document.getElementById('reset').onclick=()=>{
  camera.position.copy(homePos);
  controls.target.copy(homeTarget);
  controls.update();
};

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
